<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed | Social Media</title>

    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/posts/feed.js" defer></script>
</head>
<body>
    <header>
        <h1>Social Feed</h1>

        <nav>
            <a href="./feed.html">Feed</a>
            <a href="./profile.html">My profile</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Create Post</h2>

            <form id="createPostForm">
                <div>
                    <label for="postTitle">Title</label>
                    <input
                        type="text"
                        id="postTitle"
                        name="title"
                        required
                    >
                </div>
                <div>
                    <label for="postBody">Body</label>
                    <textarea
                        id="postBody"
                        name="body"
                        required
                    ></textarea>
                </div>
                <button type="submit">Create Post</button>
            </form>

            <p id="createPostMessage"></p>
        </section>

        <section>
            <h2>Posts</h2>
            <div id="postsContainer"></div>
        </section>
    </main>
</body>
</html>
