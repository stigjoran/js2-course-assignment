<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed | Social Media</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/posts/feed.js" defer></script>
</head>
<body>
    <header>
        <h1>Social Feed</h1>

        <nav>
            <a href="./feed.html">Feed</a>
            <a href="./profile.html" id="myProfileLink">My profile</a>
            <button id="logoutButton" class="logout-button">Logout</button>
        </nav>
    </header>

    <main>
        <section class="create-post">
            <h2>Create Post</h2>

            <form id="createPostForm" class="create-post-form">
                <div>
                    <label for="postTitle" class="form-label">Title</label>
                    <input
                        type="text"
                        id="postTitle"
                        name="title"
                        class="form-control"
                        required
                    >
                </div>
            
                <div>
                    <label for="postBody" class="form-label">Body</label>
                    <textarea
                        id="postBody"
                        name="body"
                        class="form-control"
                        required
                    ></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Create Post</button>
            </form>

            <p id="createPostMessage"></p>
        </section>

        <section class="search-section">
            <label for="searchInput" class="visually-hidden">Search posts</label>
                    <h2>Search posts</h2>
                    <input
                    type="search"
                    id="searchInput"
                    placeholder="Search posts"
                    class="form-control"
                >
        </section>

        <section class="posts-section">
            <h2>Posts</h2>
            <div id="postsContainer" class="posts-container"></div>
        </section>
    </main>
</body>
</html>
